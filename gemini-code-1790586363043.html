<head>
    <meta charset="UTF-8">

    <title>مكتبة إيزيفاي - Easifydz</title>
    
    <!-- ربط خط ثمانية من الملف المحلي -->
    <style>
        @font-face {
            font-family: 'Thmanyah Serif Display';
            src: url('thmanyahserifdisplay-Bold.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-color: #f4f4f0;
            --main-color: #000000;
            --accent-color: #e6194b; /* لون مقارب للون الأحمر في اللوجو */
            --border-width: 6px;
            --shadow-offset: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Thmanyah Serif Display', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--main-color);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: 
                linear-gradient(var(--main-color) 2px, transparent 2px),
                linear-gradient(90deg, var(--main-color) 2px, transparent 2px);
            background-size: 50px 50px;
            background-position: center center;
        }

        .container {
            background-color: #ffffff;
            border: var(--border-width) solid var(--main-color);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--main-color);
            padding: 3rem 4rem;
            text-align: center;
            max-width: 90%;
            width: 600px;
            position: relative;
            transform: rotate(-1deg);
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: rotate(0deg) translate(-2px, -2px);
            box-shadow: calc(var(--shadow-offset) + 2px) calc(var(--shadow-offset) + 2px) 0px var(--main-color);
        }

        .logo-container {
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container img {
            width: 280px;
            height: auto;
            border: 4px solid var(--main-color);
            box-shadow: 4px 4px 0px var(--main-color);
            background-color: var(--bg-color);
            padding: 15px;
            transition: transform 0.2s ease;
        }
        
        .logo-container img:hover {
             transform: scale(1.05);
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2.5rem;
            background-color: var(--accent-color);
            color: #fff;
            display: inline-block;
            padding: 5px 15px;
            border: 3px solid var(--main-color);
            transform: rotate(2deg);
            font-family: monospace;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            font-size: 1.25rem;
            font-family: monospace;
            font-weight: bold;
        }

        .contact-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--bg-color);
            border: 3px solid var(--main-color);
            padding: 10px;
            box-shadow: 3px 3px 0px var(--main-color);
            transition: all 0.2s;
            text-decoration: none;
            color: var(--main-color);
        }

        .contact-item:hover {
            background-color: var(--accent-color);
            color: #fff;
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--main-color);
        }

        .contact-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .social-btn {
            background-color: #fff;
            border: 3px solid var(--main-color);
            padding: 8px 16px;
            font-weight: bold;
            font-family: monospace;
            text-decoration: none;
            color: var(--main-color);
            box-shadow: 3px 3px 0px var(--main-color);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .social-btn:hover {
            background-color: var(--main-color);
            color: #fff;
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--main-color);
        }
        
        .social-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.8rem; }
            .container { padding: 2rem 1.5rem; }
            .logo-container img { width: 220px; }
            .contact-info { font-size: 1.1rem; }
            .social-btn { padding: 6px 12px; font-size: 0.9rem; }
        }
    </style>
</head>
